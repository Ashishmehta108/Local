[package]
name = "filefinder-desktop"
version = "0.1.0"
description = "Self-hosted multi-computer file finder"
authors = ["FileFinder"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = ["tray-icon"] }
tauri-plugin-shell = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
filefinder-agent = { path = "../../agent" }
