name: signed-windows-release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.5.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Import Authenticode certificate
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:SIGNING_CERTIFICATE_BASE64) { throw "WINDOWS_SIGNING_CERTIFICATE_BASE64 is required" }
          $certificatePath = Join-Path $env:RUNNER_TEMP "filefinder-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File $env:GITHUB_ENV -Append
      - name: Build and sign hosted installer
        shell: pwsh
        env:
          FILEFINDER_COORDINATOR_URL: ${{ vars.FILEFINDER_COORDINATOR_URL }}
        run: |
          if (-not $env:FILEFINDER_COORDINATOR_URL) { throw "Repository variable FILEFINDER_COORDINATOR_URL is required" }
          ./scripts/Prepare-WindowsDesktopRelease.ps1 -CoordinatorUrl $env:FILEFINDER_COORDINATOR_URL -HostedAgentAuth
      - uses: actions/upload-artifact@v4
        with:
          name: filefinder-signed-windows-installers
          path: target/x86_64-pc-windows-msvc/release/bundle/**
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/x86_64-pc-windows-msvc/release/bundle/**/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/**/*.msi
